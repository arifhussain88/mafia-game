# Checks every pull request into main (and any manual run) with the same gates
# the deploy uses, so a PR that would break the deploy shows red before merge.
# Needs no secrets and never touches the server.
name: CI

on:
  push:
    branches-ignore: [main] # main is covered by the deploy workflow's own gates
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, audit, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Security audit (shipped dependencies)
        run: node .github/scripts/audit-shipped.mjs

      - name: Server tests (security + gameplay)
        run: pnpm --filter @workspace/api-server run test

      - name: Build release tarball
        run: bash deploy/oracle/pack-release.sh

      - name: Smoke-test the release
        run: bash deploy/oracle/smoke-test-release.sh
