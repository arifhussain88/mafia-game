app = "mafia-wars"
primary_region = "sin"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  USERS_FILE = "/data/users.json"
  STATIC_DIR = "/app/public"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 80
    soft_limit = 50

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "mafia_data"
  destination = "/data"
  initial_size = "1gb"
